# Basic application information
application:
  name: app-name
  environment: dev
  type: deployment

# Overrides the chart name used in resource names and labels.
# Defaults to the chart name when empty. Note: application.name, when set,
# takes precedence for the fullname (resource names).
nameOverride: ""

### Deployment Configuration
deployment:
  replicaCount: 1

  hpa:
    enabled: false
    minReplicas: 1
    maxReplicas: 10
    targetCPUUtilizationPercentage: 80
    # targetMemoryUtilizationPercentage: 80

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%

### Image Configuration
image:
  repository: hello-world
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: "latest"

imagePullSecrets: []

### Environment Variables
env: []
  # - name: MY_ENV_VAR
  #   value: "my-value"
  # - name: ANOTHER_ENV_VAR
  #   valueFrom:
  #     secretKeyRef:
  #       name: my-secret
  #       key: secret-key

envFromConfigMaps: []
  # - name: my-config-map

envFromSecrets: []
  # - name: my-secret

externalSecrets:
  # secrets:
  #   - name: my-external-secret
  #     key: cluster/namespace/my-external-secret
  #     refreshInterval: 1h
  #     secretStore: vault-oke

configMaps: {}
  # my-env-config:
  #   # How this ConfigMap is mounted into the workload:
  #   #   env  -> all key/values injected via envFrom (environment variables)
  #   #   file -> mounted as a volume (each key becomes a file under mountPath)
  #   # When omitted, the ConfigMap is only created (not mounted).
  #   mountAs: env
  #   data:
  #     LOG_LEVEL: info
  #   labels:
  #     app: my-app
  #   annotations:
  #     description: "This is my config map"
  # my-file-config:
  #   mountAs: file
  #   # REQUIRED when mountAs is "file".
  #   mountPath: /etc/my-app
  #   # Optional: mount a single key/file (note: subPath mounts do not
  #   # receive live updates when the ConfigMap changes).
  #   # subPath: app.conf
  #   # Optional: project only some keys / rename them.
  #   # items:
  #   #   - key: app.conf
  #   #     path: app.conf
  #   # Optional: file permissions (octal, e.g. 0444).
  #   # defaultMode: 0444
  #   # Optional: defaults to true.
  #   # readOnly: true
  #   data:
  #     app.conf: |
  #       key=value
  # legacy-config:
  #   # DEPRECATED: equivalent to "mountAs: env". Kept for backward
  #   # compatibility; "mountAs" takes precedence when both are set.
  #   envFrom: true
  #   data:
  #     my-key: my-value

podAnnotations: {}
podLabels: {}

resources: {}
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

livenessProbe: {}
  # httpGet:
  #   path: /status
  #   port: http
  # initialDelaySeconds: 5
  # periodSeconds: 5

readinessProbe: {}
  # httpGet:
  #   path: /status
  #   port: http
  # initialDelaySeconds: 5
  # periodSeconds: 5

# Persistent Volume Claim configuration
persistence:
  enabled: false
  # name: data
  accessMode: ReadWriteOnce
  # size is REQUIRED when persistence.enabled is true (e.g. 5Gi)
  # size: 5Gi
  # mountPath: /data
  # storageClass: standard

# Additional volumes on the output Deployment definition.
# Supported types: configMap, secret and emptyDir.
volumes: []
# - name: foo
#   secret:
#     secretName: mysecret
#     optional: false
# # emptyDir: scratch space (useful with readOnlyRootFilesystem: true)
# - name: tmp
#   emptyDir: {}
# - name: cache
#   emptyDir:
#     medium: Memory    # optional: "" (node disk, default) or Memory (tmpfs)
#     sizeLimit: 128Mi  # optional

# Additional volumeMounts on the output Deployment definition.
volumeMounts: []
# - name: foo
#   mountPath: "/etc/foo"
#   readOnly: true
# - name: tmp
#   mountPath: /tmp

nodeSelector: {}

tolerations: []

affinity: {}

serviceAccount:
  create: true
  # Name of the ServiceAccount to use. If empty, defaults to the fullname
  # when create is true, or "default" when create is false.
  name: ""
  annotations: {}
  # Set to true only if the workload needs to talk to the Kubernetes API.
  automountServiceAccountToken: false

podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
    - ALL
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 1000
  seccompProfile:
    type: RuntimeDefault

### Service Configuration
service:
  type: ClusterIP
  port: 80


### Ingress Configuration
ingress:
  enabled: false
  # className: ""
  # annotations: {}
