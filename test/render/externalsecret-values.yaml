# Render-only scenario (ExternalSecrets CRD not present in a vanilla kind
# cluster, so this is validated statically by kubeconform, not by ct install).
image:
  repository: registry.k8s.io/pause
  tag: "3.10"
externalSecrets:
  secretStoreKind: ClusterSecretStore
  secrets:
    - name: my-external-secret
      key: cluster/namespace/my-external-secret
      refreshInterval: 1h
      secretStore: vault-backend
