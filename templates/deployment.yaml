{{- if eq .Values.application.type "deployment" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "base-template-chart.fullname" . }}
  labels:
    {{- include "base-template-chart.labels" . | nindent 4 }}
spec:
  {{- if not .Values.deployment.hpa.enabled }}
  replicas: {{ .Values.deployment.replicaCount | default 1 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "base-template-chart.selectorLabels" . | nindent 6 }}
  {{- if .Values.deployment.strategy }}
  strategy:
    {{- toYaml .Values.deployment.strategy | nindent 8 }}
  {{- end }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "base-template-chart.labels" . | nindent 8 }}
  {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "base-template-chart.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Values.application.name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          {{- if .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          {{- end }}
          {{- if .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}

          {{- /* ConfigMaps from .Values.configMaps split by mount mode */}}
          {{- $cmEnv := list }}
          {{- $cmFile := list }}
          {{- range $name, $cm := .Values.configMaps }}
          {{- $mode := include "base-template-chart.configMapMountAs" $cm }}
          {{- if eq $mode "env" }}{{ $cmEnv = append $cmEnv $name }}{{ end }}
          {{- if eq $mode "file" }}{{ $cmFile = append $cmFile $name }}{{ end }}
          {{- end }}

          {{- if or .Values.volumeMounts .Values.persistence.enabled $cmFile }}
          volumeMounts:
          {{- range $volumeMount := .Values.volumeMounts }}
            - name: {{ $volumeMount.name }}
              mountPath: {{ $volumeMount.mountPath }}
              {{- if $volumeMount.subPath }}
              subPath: {{ $volumeMount.subPath }}
              {{- end }}
              {{- if $volumeMount.readOnly }}
              readOnly: true
              {{- end }}
          {{- end }}
          {{- range $name := $cmFile }}
          {{- $cm := index $.Values.configMaps $name }}
          {{- $readOnly := true }}
          {{- if hasKey $cm "readOnly" }}{{ $readOnly = $cm.readOnly }}{{ end }}
            - name: {{ include "base-template-chart.configMapVolumeName" $name }}
              mountPath: {{ required (printf "configMaps.%s.mountPath is required when mountAs is \"file\"" $name) $cm.mountPath }}
              {{- if $cm.subPath }}
              subPath: {{ $cm.subPath }}
              {{- end }}
              {{- if $readOnly }}
              readOnly: true
              {{- end }}
          {{- end }}
          {{- if .Values.persistence.enabled }}
            - name: {{ .Values.persistence.name | default "data" }}
              mountPath: {{ .Values.persistence.mountPath }}
          {{- end }}
          {{- end }}

          {{- with .Values.env }}
          {{- if gt (len .) 0 }}
          env:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- end }}

          {{- if or .Values.envFromConfigMaps (and .Values.externalSecrets .Values.externalSecrets.secrets) .Values.envFromSecrets $cmEnv }}
          envFrom:
            {{- range $name := $cmEnv }}
            - configMapRef:
                name: {{ $name }}
            {{- end }}
            {{- if .Values.envFromConfigMaps }}
            {{- range $configMap := .Values.envFromConfigMaps }}
            - configMapRef:
                name: {{ $configMap.name }}
            {{- end }}
            {{- end }}

            {{- if .Values.externalSecrets }}
            {{- range $externalSecret := .Values.externalSecrets.secrets }}
            - secretRef:
                name: {{ $externalSecret.name }}
            {{- end }}
            {{- end }}

            {{- if .Values.envFromSecrets }}
            {{- range $secret := .Values.envFromSecrets }}
            - secretRef:
                name: {{ $secret.name }}
            {{- end }}
            {{- end }}
          {{- end }}

      {{- if or .Values.volumes .Values.persistence.enabled $cmFile }}
      volumes:
         {{- range $volumes := .Values.volumes }}
        - name: {{ $volumes.name }}
          {{- if $volumes.configMap }}
          configMap:
            name: {{ $volumes.configMap.name }}
            {{- if $volumes.configMap.items }}
            items:
              {{- toYaml $volumes.configMap.items | nindent 16 }}
            {{- end }}
          {{- end }}
          {{- if $volumes.secret }}
          secret:
            secretName: {{ $volumes.secret.secretName }}
            {{- if $volumes.secret.items }}
            items:
              {{- toYaml $volumes.secret.items | nindent 16 }}
            {{- end }}
          {{- end }}
          {{- if hasKey $volumes "emptyDir" }}
          {{- $emptyDir := $volumes.emptyDir | default dict }}
          {{- if or $emptyDir.medium $emptyDir.sizeLimit }}
          emptyDir:
            {{- with $emptyDir.medium }}
            medium: {{ . }}
            {{- end }}
            {{- with $emptyDir.sizeLimit }}
            sizeLimit: {{ . | quote }}
            {{- end }}
          {{- else }}
          emptyDir: {}
          {{- end }}
          {{- end }}
        {{- end }}

        {{- range $name := $cmFile }}
        {{- $cm := index $.Values.configMaps $name }}
        - name: {{ include "base-template-chart.configMapVolumeName" $name }}
          configMap:
            name: {{ $name }}
            {{- with $cm.items }}
            items:
              {{- toYaml . | nindent 16 }}
            {{- end }}
            {{- if hasKey $cm "defaultMode" }}
            defaultMode: {{ $cm.defaultMode | int }}
            {{- end }}
        {{- end }}

        {{- if .Values.persistence.enabled }}
        - name: {{ .Values.persistence.name | default "data" }}
          persistentVolumeClaim:
            claimName: {{ include "base-template-chart.fullname" . }}-data
        {{- end }}
      {{- end }}

      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}