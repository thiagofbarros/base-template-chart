name: Release Helm Chart

on:
  push:
    tags:
      - 'v*.*.*'


permissions:
  contents: read
  id-token: write # for OIDC to AWS

jobs:
  release:
    name: Package and Push Helm Chart to ECR
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      ECR_REGISTRY: ${{ vars.ECR_REGISTRY }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Extract version from tag
        id: vars
        run: |
          TAG_REF="${GITHUB_REF##*/}" # e.g. v1.2.3
          VERSION=${TAG_REF#v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Setup Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.1.0

      - name: Configure AWS credentials (OIDC Role)
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}

      - name: Helm Lint
        run: |
          helm lint .

      - name: Validate chart version matches tag
        run: |
          CHART_VERSION=$(grep '^version:' Chart.yaml | awk '{print $2}')
          if [ "$CHART_VERSION" != "${{ steps.vars.outputs.version }}" ]; then
            echo "Chart.yaml version ($CHART_VERSION) does not match tag version (${{ steps.vars.outputs.version }})" >&2
            exit 1
          fi

      - name: Package chart
        run: |
          helm dependency update .
          helm package . --version "${{ steps.vars.outputs.version }}" --app-version "${{ steps.vars.outputs.version }}"

      - name: Ensure ECR repository exists
        run: |
          CHART_NAME=$(grep '^name:' Chart.yaml | awk '{print $2}')
          # helm push appends the chart name to the destination path, so the ECR
          # repository must be "<prefix>/<chart>" (or just "<chart>" without a prefix).
          if [ -n "$ECR_REPOSITORY" ]; then
            REPO_PATH="$ECR_REPOSITORY/$CHART_NAME"
          else
            REPO_PATH="$CHART_NAME"
          fi
          echo "REPO_PATH=$REPO_PATH" >> "$GITHUB_ENV"
          # ECR does not auto-create repositories on push; ensure it exists (idempotent).
          if ! aws ecr describe-repositories --region "$AWS_REGION" --repository-names "$REPO_PATH" >/dev/null 2>&1; then
            echo "Repository $REPO_PATH not found, creating it"
            aws ecr create-repository --region "$AWS_REGION" --repository-name "$REPO_PATH" >/dev/null
          fi

      - name: Login to ECR (OCI)
        run: |
          aws ecr get-login-password --region "$AWS_REGION" | helm registry login -u AWS --password-stdin "$ECR_REGISTRY"

      - name: Push chart to ECR OCI registry
        id: push
        run: |
          CHART_NAME=$(grep '^name:' Chart.yaml | awk '{print $2}')
          PACKAGE_FILE="${CHART_NAME}-${{ steps.vars.outputs.version }}.tgz"
          # helm push appends the chart name, so target the registry (+ optional prefix).
          if [ -n "$ECR_REPOSITORY" ]; then
            DESTINATION="oci://$ECR_REGISTRY/$ECR_REPOSITORY"
          else
            DESTINATION="oci://$ECR_REGISTRY"
          fi
          echo "Pushing $PACKAGE_FILE to $DESTINATION (repository: $REPO_PATH)"
          helm push "$PACKAGE_FILE" "$DESTINATION" 2>&1 | tee push.out
          # Capture the content digest so signatures/attestations target it immutably.
          DIGEST=$(grep -i '^Digest:' push.out | awk '{print $2}')
          if [ -z "$DIGEST" ]; then
            echo "Could not determine pushed chart digest" >&2
            exit 1
          fi
          echo "chart_ref=${ECR_REGISTRY}/${REPO_PATH}@${DIGEST}" >> "$GITHUB_OUTPUT"
          echo "package_file=${PACKAGE_FILE}" >> "$GITHUB_OUTPUT"

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Log in to ECR for cosign
        run: |
          aws ecr get-login-password --region "$AWS_REGION" \
            | cosign login "$ECR_REGISTRY" -u AWS --password-stdin

      - name: Sign chart (keyless)
        env:
          COSIGN_YES: "true"
        run: |
          cosign sign "${{ steps.push.outputs.chart_ref }}"

      - name: Generate SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          file: ${{ steps.push.outputs.package_file }}
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Attest SBOM (keyless)
        env:
          COSIGN_YES: "true"
        run: |
          cosign attest --type spdxjson \
            --predicate sbom.spdx.json \
            "${{ steps.push.outputs.chart_ref }}"

      - name: Output artifact name
        run: |
          CHART_NAME=$(grep '^name:' Chart.yaml | awk '{print $2}')
          echo "Chart $CHART_NAME ${{ steps.vars.outputs.version }} pushed, signed and attested"
          echo "Ref: ${{ steps.push.outputs.chart_ref }}"